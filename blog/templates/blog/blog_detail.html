{% extends "catalog/base.html" %}

{% block content %}
<h1>{{ object.title }}</h1>

{% if object.preview %}
    <img src="{{ object.preview.url }}" class="img-fluid mb-3" alt="Превью">
{% endif %}

<p>{{ object.content }}</p>

<p class="text-muted">
    📅 {{ object.created_at|date:"d.m.Y" }} | 👁️ {{ object.views }} просмотров
</p>

<div class="mt-4">
    <a href="{% url 'blog:blog_update' object.pk %}" class="btn btn-primary">✏️ Редактировать</a>
    <a href="{% url 'blog:blog_delete' object.pk %}" class="btn btn-danger">🗑️ Удалить</a>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">← Назад</a>
</div>
{% endblock %}
