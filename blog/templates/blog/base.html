{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Блог</title>

    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">

    {% block extra_head %}{% endblock %}
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header class="blog-header py-3 mb-4 border-bottom">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-4">
            <a class="text-muted" href="{% url 'catalog:products_list' %}">Магазин</a>
          </div>
          <div class="col-4 text-center">
            <a class="blog-header-logo text-dark h3 text-decoration-none" href="{% url 'blog:blog_list' %}">Блог</a>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-outline-primary" href="{% url 'blog:blog_create' %}">➕ Новая статья</a>
          </div>
        </div>
      </header>
    </div>

    <!-- Main content -->
    <main role="main" class="container">
      {% block content %}
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="blog-footer text-center mt-5 py-3 border-top">
      <p>Блог магазина товаров</p>
      <p><a href="#">Наверх</a></p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
