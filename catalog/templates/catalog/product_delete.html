{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удаление товара</h4>
                </div>

                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <p class="lead">Вы уверены, что хотите удалить товар <strong>"{{ object.name }}"</strong>?</p>
                        <p class="text-muted">Это действие нельзя будет отменить.</p>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">
                                ← Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
