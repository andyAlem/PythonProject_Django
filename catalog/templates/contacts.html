{% extends "base.html" %}

{% block content %}
  <section class="py-5 text-center container">
    <div class="row py-lg-5">
      <div class="col-lg-8 col-md-8 mx-auto">
        <h1 class="fw-light">Контакты</h1>
        <p class="lead text-body-secondary">Свяжитесь с нами любым удобным способом. Мы всегда рады помочь!</p>
      </div>
    </div>
  </section>

  <div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row">
        <!-- Форма обратной связи -->
        <div class="col-md-6 mx-auto">
          <div class="card shadow-sm">
            <div class="card-header">
              <h4 class="my-0 font-weight-normal">Форма обратной связи</h4>
            </div>
            <div class="card-body">
              <form method="post" class="form-floating">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="name" class="form-label">Имя</label>
                  <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя" required>
                </div>
                <div class="mb-3">
                  <label for="phone" class="form-label">Телефон</label>
                  <input type="tel" name="phone" class="form-control" id="phone" placeholder="Контактный телефон" required>
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Сообщение</label>
                  <textarea name="message" class="form-control" id="message" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Отправить</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
